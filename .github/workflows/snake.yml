name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate GitHub contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: SyntX34
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Move snake SVGs to root
        run: |
          mkdir -p dist
          cp dist/github-snake.svg ./github-snake.svg || true
          cp dist/github-snake-dark.svg ./github-snake-dark.svg || true

      - name: Push snake animation to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for changes in main
        id: verify_diff
        run: |
          git diff --quiet github-snake.svg || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push to main if changed
        if: steps.verify_diff.outputs.changed == 'true'
        run: |
          git config --local user.email "97087641+SyntX34@users.noreply.github.com"
          git config --local user.name "SyntX34"
          git add github-snake.svg github-snake-dark.svg || true
          git commit -m "🐍 Update contribution snake animation [skip ci]" || exit 0
          git push origin HEAD:main
