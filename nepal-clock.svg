<svg xmlns="http://www.w3.org/2000/svg" width="420" height="120" viewBox="0 0 420 120">
  <defs>
    <style>
      .bg { fill: #1e1e2e; }
      .time { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 54px; font-weight: 700; fill: #f5c2e7; }
      .seconds { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 28px; font-weight: 400; fill: #cba6f7; }
      .ampm { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 18px; font-weight: 400; fill: #89b4fa; }
      .date { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; fill: #89b4fa; }
      .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; fill: #6c7086; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect class="bg" x="0" y="0" width="420" height="120" rx="12" ry="12" />
  
  <!-- Nepal flag indicator -->
  <rect x="0" y="0" width="6" height="120" rx="3" ry="3" fill="#f5c2e7" opacity="0.6"/>
  
  <!-- Timezone label -->
  <text class="label" x="20" y="22">Nepal Standard Time</text>
  
  <!-- Digital Clock: HH:MM -->
  <text class="time" x="20" y="82">11:38</text>
  
  <!-- Seconds -->
  <text class="seconds" x="222" y="72">:45</text>
  
  <!-- AM/PM -->
  <text class="ampm" x="258" y="70">PM</text>
  
  <!-- Date -->
  <text class="date" x="20" y="104">Wednesday, July 29, 2026</text>
  
  <!-- Nepal flag emoji as text -->
  <text font-size="16" x="385" y="84">🇳🇵</text>
  
  <!-- Pulse dots for "live" feel -->
  <circle cx="370" cy="18" r="4" fill="#a6e3a1" opacity="0.9">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
  </circle>
  <text class="label" x="348" y="22">LIVE</text>
</svg>